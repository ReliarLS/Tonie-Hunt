<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tonies-Sammler</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a6b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="bar">
    <button id="menuBtn" class="iconbtn" aria-label="Menü öffnen">☰</button>
    <h1>Tonies</h1>
    <input id="search" type="search" placeholder="Suchen …" aria-label="Suchen" autocomplete="off">
  </div>
  <nav id="tabs" role="tablist" aria-label="Ansicht"></nav>
  <div class="tools">
    <label>Gruppe
      <select id="groupBy">
        <option value="none">Keine</option>
        <option value="serie">Serie</option>
        <option value="status">Status</option>
        <option value="art">Art</option>
        <option value="besitz">Besitz</option>
        <option value="buchstabe">Anfangsbuchstabe</option>
      </select>
    </label>
    <label>Art <select id="artFilter"></select></label>
    <span id="count" aria-live="polite"></span>
  </div>
</header>

<main id="list"></main>

<div id="scrim" hidden></div>
<aside id="side" aria-label="Menü" hidden>
  <div class="sidehead"><strong>Tonies-Sammler</strong><button id="sideClose" class="iconbtn" aria-label="Schließen">✕</button></div>
  <button class="item primary" data-act="new">＋ Neuen Tonie erstellen</button>
  <h2>Katalog</h2>
  <button class="item" data-act="import">Katalog aus Datei einlesen</button>
  <button class="item" data-act="server">Update vom Server laden</button>
  <button class="item" data-act="export">Bibliothek exportieren <small>ohne Besitz-Markierung</small></button>
  <button class="item" data-act="seen">Alle Neuheiten als gesehen markieren</button>
  <h2>Mein Besitz</h2>
  <button class="item" data-act="ownexport">Besitz sichern (Datei)</button>
  <button class="item" data-act="ownimport">Besitz aus Datei laden</button>
  <h2>Darstellung</h2>
  <div class="swatchrow" id="accentRow" aria-label="Akzentfarbe"></div>
  <div class="swatchrow" id="bgRow" aria-label="Hintergrund"></div>
  <p id="info" class="muted"></p>
  <input type="file" id="fileCatalog" accept=".json,application/json" hidden>
  <input type="file" id="fileOwn" accept=".json,application/json" hidden>
</aside>

<div id="sheetWrap" hidden>
  <div id="sheetBack"></div>
  <section id="sheet" role="dialog" aria-modal="true" aria-label="Details"></section>
</div>

<dialog id="form">
  <form method="dialog" id="formEl">
    <h2 id="formTitle">Neuer Tonie</h2>
    <label>Serie / Name <input name="serie" list="serienListe" autocomplete="off"></label>
    <datalist id="serienListe"></datalist>
    <label>Titel <input name="titel" required autocomplete="off"></label>
    <label>Status
      <select name="status">
        <option value="aktuell">Aktuell</option>
        <option value="letzte_chance">Bald Rarität (Letzte Chance)</option>
        <option value="raritaet">Rarität</option>
      </select>
    </label>
    <label>Art
      <select name="gruppe">
        <option>Einzelne Tonies</option><option>Pocket Tonies</option>
        <option>Besondere Tonies</option><option>Kreativ-Tonies</option>
      </select>
    </label>
    <label>Originalpreis (€, optional) <input name="preis" type="number" step="0.01" min="0" inputmode="decimal"></label>
    <label>Bild (optional) <input name="bild" type="file" accept="image/*"></label>
    <div class="formbtns">
      <button type="button" id="formCancel" class="btn">Abbrechen</button>
      <button type="submit" class="btn solid">Speichern</button>
    </div>
  </form>
</dialog>

<input type="file" id="filePhoto" accept="image/*" hidden>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
